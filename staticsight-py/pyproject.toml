[project]
name = "staticsight-mcp"
version = "0.1.0"
description = "StaticSight: zero-compile C++ code-review context for AI agents over MCP (ctags, GNU Global, ripgrep, cppcheck)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # FastMCP lives at mcp.server.fastmcp in the 1.x SDK (renamed to MCPServer in 2.x).
    "mcp[cli]>=1.12,<2",
]

[project.optional-dependencies]
# Local semantic code search (ONNX embedding model, no PyTorch): pip install "staticsight-mcp[semantic]"
semantic = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.24",
]

[project.scripts]
staticsight = "staticsight.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # semantic search (the test suite uses the deterministic test embedder, but numpy is needed)
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staticsight"]

[tool.hatch.build.targets.wheel.force-include]
"../shared/prompts" = "staticsight/_shared/prompts"
"../shared/tool-spec.json" = "staticsight/_shared/tool-spec.json"
"../shared/semantic" = "staticsight/_shared/semantic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
